name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build, e2e
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: tesslet
          POSTGRES_PASSWORD: tesslet
          POSTGRES_DB: tesslet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tesslet -h localhost"
          --health-interval 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://tesslet:tesslet@localhost:5432/tesslet
      UPLOAD_DIR: ./data/uploads
      ADMIN_EMAILS: e2e@test.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npm run test:e2e
      - name: Server log
        if: failure()
        run: cat server.log

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
